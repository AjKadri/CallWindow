[package]
name = "callwindow-escrow"
version = "0.1.0"
description = "Bounded CallWindow demo auction escrow program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "callwindow_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["associated_token", "token"] }

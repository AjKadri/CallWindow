<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">CallWindow header preview</title>
  <desc id="desc">CallWindow's own auction interface header with a verified localnet example.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edfdfa"/>
      <stop offset="0.54" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff7f1"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2f635c" flood-opacity="0.16"/>
    </filter>
    <filter id="black-logo" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.5" intercept="-0.1"/>
        <feFuncG type="linear" slope="1.5" intercept="-0.1"/>
        <feFuncB type="linear" slope="1.5" intercept="-0.1"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1440" height="820" fill="url(#wash)"/>
  <rect x="48" y="42" width="1344" height="736" rx="34" fill="#fff" stroke="#151515" stroke-width="3" filter="url(#soft-shadow)"/>
  <rect x="49.5" y="43.5" width="1341" height="108" rx="32" fill="#fff"/>
  <path d="M50 151h1340" stroke="#151515" stroke-opacity=".1"/>
  <g transform="translate(86 67) scale(.48)" fill="#151515" aria-label="CallWindow symbol">
    <path d="M8 13h29c5 0 9 2 13 6 4-4 8-6 13-6h29v10H64c-4 0-8 2-14 8-6-6-10-8-14-8H8V13Z"/>
    <path d="M8 29h29c5 0 9 2 13 6 4-4 8-6 13-6h29v10H64c-4 0-8 2-14 8-6-6-10-8-14-8H8V29Z"/>
    <path d="M8 53h29c4 0 8-2 14-8 6 6 10 8 14 8h29v10H65c-5 0-9-2-15-8-6 6-10 8-15 8H8V53Z"/>
    <path d="M8 69h29c4 0 8-2 14-8 6 6 10 8 14 8h29v10H64c-5 0-9-2-13-6-4 4-8 6-13 6H8V69Z"/>
  </g>
  <text x="145" y="111" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-1.5">CallWindow</text>

  <rect x="915" y="73" width="402" height="50" rx="25" fill="#eff1f0"/>
  <text x="948" y="104" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="16">Auction</text>
  <text x="1028" y="104" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="16">How it works</text>
  <text x="1150" y="104" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="16">Why scheduled</text>
  <rect x="1233" y="79" width="72" height="38" rx="19" fill="#a9eee2"/>
  <text x="1247" y="103" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="12">Preview</text>

  <text x="86" y="230" fill="#70817d" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3">SEE THE MECHANISM</text>
  <text x="86" y="310" fill="#151515" font-family="Georgia, serif" font-size="70" letter-spacing="-4">Patient limits meet</text>
  <text x="86" y="377" fill="#151515" font-family="Georgia, serif" font-size="70" font-style="italic" letter-spacing="-4">at one price.</text>
  <text x="88" y="430" fill="#6f7775" font-family="Inter, Arial, sans-serif" font-size="18">Funded buy and sell limits meet at cutoff, then settle transparently.</text>

  <rect x="874" y="205" width="460" height="430" rx="28" fill="#f5fbfa" stroke="#b9ddd5"/>
  <text x="909" y="250" fill="#6d8781" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2">VERIFIED LOCALNET EXAMPLE</text>
  <text x="909" y="300" fill="#151515" font-family="Georgia, serif" font-size="29">One clearing price</text>
  <rect x="909" y="325" width="390" height="64" rx="16" fill="#eff8fb"/>
  <text x="931" y="351" fill="#6f7775" font-family="Inter, Arial, sans-serif" font-size="12">Buy 5.00 DEMO-EQUITY @ 20.10</text>
  <text x="931" y="373" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="14">Deposit 100.50 DEMO-USD</text>
  <rect x="909" y="402" width="390" height="64" rx="16" fill="#f1fbf8"/>
  <text x="931" y="428" fill="#6f7775" font-family="Inter, Arial, sans-serif" font-size="12">Sell 3.00 DEMO-EQUITY @ 19.90</text>
  <text x="931" y="450" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="14">Deposit 3.00 DEMO-EQUITY</text>
  <path d="M1002 483h204" stroke="#9acdc2" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="909" y="525" fill="#1c5d52" font-family="Georgia, serif" font-size="28">20.00 DEMO-USD</text>
  <text x="909" y="553" fill="#6f7775" font-family="Inter, Arial, sans-serif" font-size="13">3.00 matched · 40.50 refunded</text>
  <rect x="86" y="520" width="610" height="72" rx="20" fill="#effbf8"/>
  <text x="112" y="550" fill="#236b5e" font-family="Inter, Arial, sans-serif" font-size="14">Public devnet proof verified</text>
  <text x="112" y="574" fill="#6f7775" font-family="Inter, Arial, sans-serif" font-size="13">24 finalized transactions · Explorer links in the app.</text>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=/demo/" />
    <title>Auction Room moved | CallWindow</title>
    <script>
      const query = new URLSearchParams(window.location.search);
      const target = new URL("/demo/", window.location.origin);
      const legacyAuction = query.get("auction");
      if (legacyAuction) target.searchParams.set("legacyAuction", legacyAuction);
      window.location.replace(target.pathname + target.search);
    </script>
  </head>
  <body>
    <p>This legacy Auction Room route has moved into the market-specific Demo.</p>
    <p><a href="/demo/">Open the CallWindow Demo</a></p>
  </body>
</html>
